{% include "_partials/head.html" %}
<div class="slide-body-area bignum-area" data-fit>
  {# count-up は数字が増えていく動き。数値そのものが主役のときだけ使う #}
  <p class="clip bignum-value" data-seq="head" data-seq-offset="0.3" data-anim="count-up">
    {{ c['lead'] }}
  </p>
  {% if c['body'] %}
  <p class="clip bignum-body" data-seq="head" data-seq-offset="0.65" data-anim="rise">{{ c['body'] }}</p>
  {% endif %}
  {% if c['note'] %}
  <p class="clip bignum-note" data-seq="tail" data-anim="fade">{{ c['note'] }}</p>
  {% endif %}
</div>
